services:
  csp-catalog-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: csp-catalog-portal
    ports:
      - "4203:80"
    networks:
      - csp-frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  # Create once with: docker network create csp-frontend
  csp-frontend:
    external: true
    name: csp-frontend
