name: CI

# Every Pull Request builds the repository and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint --if-present
      - run: npm test -- --browsers=ChromeHeadless
      - run: docker build --file deploy/Dockerfile --tag csp-catalog-portal:ci .

      - name: Check the CORS rule of the image
        run: |
          # The shell loads this portal from another origin (ADR-026): the image must answer
          # the allowed origin, stay silent for any other, and refuse to start without the rule.
          ! docker run --rm csp-catalog-portal:ci
          docker run -d --name portal -p 8080:80 -e 'CORS_ALLOWED_ORIGIN_REGEX=^http://localhost:420[0-5]$' csp-catalog-portal:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health >/dev/null && break; sleep 1; done
          module=$(docker exec portal sh -c 'cd /usr/share/nginx/html && ls *.js | head -1')
          for file in remoteEntry.json "$module"; do
            curl -fsD - -o /dev/null -H 'Origin: http://localhost:4200' "http://localhost:8080/$file" | grep -i '^access-control-allow-origin: http://localhost:4200'
            ! curl -fsD - -o /dev/null -H 'Origin: http://evil.example' "http://localhost:8080/$file" | grep -i '^access-control-allow-origin'
          done
          docker rm -f portal
